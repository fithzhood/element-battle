<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;padding:0;background:#07080e;overflow:hidden}
iframe{border:0;display:block;position:absolute;left:0;top:0}</style></head>
<body><script>
const q = new URLSearchParams(location.search);
const w = +(q.get('w') || 384), h = +(q.get('h') || 800);
const f = document.createElement('iframe');
f.width = w; f.height = h; f.style.width = w + 'px'; f.style.height = h + 'px';
f.src = 'element.html?' + (q.get('q') || 'auto&debug');
document.body.appendChild(f);

const drive = q.get('drive');
const pausa = n => new Promise(r => setTimeout(r, n));

/* victory() adesso si ferma sul resoconto dell'onda e aspetta un tocco:
   chi vuole la schermata del bottino deve passarci sopra. */
async function passaResoconto(){
  await pausa(900);
  const doc = f.contentDocument;
  const rep = doc.getElementById('report');
  if (rep && !rep.hidden) { doc.getElementById('btn-report-go').click(); await pausa(400); }
}

f.onload = () => setTimeout(async () => {
  const g = f.contentWindow.__el;
  if (!g || !drive) return;
  const D = f.contentWindow.ElementData;
  const [cmd, arg] = drive.split(':');

  if (cmd === 'boss') {
    g.wave = +(q.get('wave') || 11);
    g.nextElement = arg2El(q.get('el'));
    g.createEnemy();
    if (q.get('force')) { g.challenge = Object.assign({}, D.CHALLENGES.find(c => c.type === q.get('force')), {reflected:0}); g.applyChallengeEntry(); g.renderQuest(); g.renderAttacks(); }
  }
  if (cmd === 'reward')   { if (q.get('wave')) { g.wave = +q.get('wave'); g.createEnemy(); }
                            if (q.get('next')) g.nextElement = q.get('next');
                            g.enemy.hp = 0; g.victory(); await passaResoconto(); }
  /* il resoconto dell'onda: `hit` prima, cosi' la quest ha una storia da raccontare */
  if (cmd === 'report')   { g.wave = +(q.get('wave') || 12); g.nextElement = q.get('el') || 'nature';
                            (q.get('art') || '').split(',').filter(Boolean)
                              .forEach(id => g.artifacts.push(D.ARTIFACT_BY_ID[id]));
                            g.attacks = {fire:9,water:9,nature:9,light:9,darkness:9};
                            g.createEnemy();
                            if (q.get('quest')) { g.quest = D.QUESTS.find(x => x.type === q.get('quest')); g.renderQuest(); }
                            if (q.get('fail')) g.questFailed = true;
                            g.enemy.hp = 0; g.victory(); await pausa(1200); }
  if (cmd === 'mystery')  { g.wave = +(q.get('wave') || 31); g.createEnemy();
                            g.enemy.hp = 0; g.victory(); await passaResoconto();
                            const doc = f.contentDocument;
                            const my = doc.querySelector('#reward-inner .pack.mystery');
                            if (my) { my.click(); await pausa(500); } }
  if (cmd === 'hit')      { g.wave=+(q.get('wave')||40); g.nextElement=q.get('el')||'nature';
                            g.attacks={fire:9,water:9,nature:9,light:9,darkness:9}; g.createEnemy();
                            g.attack(q.get('with')||'fire'); }
  if (cmd === 'artifact') { g.wave = 11; g.nextElement = arg2El(q.get('el')); g.createEnemy(); g.enemy.hp = 0; g.victory(); await passaResoconto(); }
  /* boss arrivato senza sfida: paga piu' artefatti, e ne offre di piu' */
  /* l'artefatto raccolto, in grande */
  if (cmd === 'artshow')  { g.wave = +(q.get('wave') || 11); g.nextElement = arg2El(q.get('el'));
                            g.createEnemy(); g.enemy.hp = 0; g.victory(); await passaResoconto();
                            const doc = f.contentDocument;
                            const carte = Array.from(doc.querySelectorAll('#reward-inner .artifact-card'));
                            const voluto = q.get('art');
                            const D2 = f.contentWindow.ElementData;
                            let c = carte[0];
                            if (voluto) {
                              const nome = D2.ARTIFACT_BY_ID[voluto] && D2.ARTIFACT_BY_ID[voluto].name;
                              /* la mano e' casuale: se non c'e' quello voluto lo si mette a forza */
                              if (!carte.some(x => x.querySelector('.artifact-name').textContent === nome)) {
                                c.querySelector('.artifact-name').textContent = nome;
                                c.onclick = () => g.takeArtifact(D2.ARTIFACT_BY_ID[voluto]);
                              } else {
                                c = carte.find(x => x.querySelector('.artifact-name').textContent === nome);
                              }
                            }
                            c.click(); await pausa(700); }
  /* mano magra: la luce e' carica e il pulsante lo dice */
  if (cmd === 'carica')   { g.wave = +(q.get('wave') || 30); g.nextElement = arg2El(q.get('el'));
                            g.createEnemy();
                            g.attacks = {fire:2,water:1,nature:3,light:2,darkness:0};
                            g.renderAll(); }
  if (cmd === 'help')     { g.wave = +(q.get('wave') || 24); g.nextElement = arg2El(q.get('el'));
                            g.attacks = {fire:3,water:2,nature:4,light:3,darkness:1};
                            g.createEnemy(); g.renderAttacks(); g.showHelp(); }
  /* la collezione visibile mentre si sceglie l'artefatto */
  if (cmd === 'owned')    { g.wave = +(q.get('wave') || 31); g.nextElement = arg2El(q.get('el'));
                            const D2 = f.contentWindow.ElementData;
                            ['w1f','s1w','w2dl','s2fl','s1n'].forEach(id => g.artifacts.push(D2.ARTIFACT_BY_ID[id]));
                            g.attacks = {fire:60,water:9,nature:9,light:9,darkness:9};
                            g.createEnemy(); g.enemy.hp = 0; g.victory(); await passaResoconto(); }
  if (cmd === 'nerfed')   { g.skipChallenge = true; g.wave = +(q.get('wave') || 21);
                            g.nextElement = arg2El(q.get('el')); g.createEnemy();
                            g.enemy.hp = 0; g.victory(); await passaResoconto(); }
  if (cmd === 'shelf')    { ['w1f','s1w','w2dl','s2fl','b1'].forEach(id => g.artifacts.push(D.ARTIFACT_BY_ID[id])); g.renderShelf(); }
  if (cmd === 'ending')   { g.wave = 91; ['w1f','s1w','w2dl'].forEach(id => g.artifacts.push(D.ARTIFACT_BY_ID[id])); g.showEnding(); }
  if (cmd === 'gameover') { Object.keys(g.attacks).forEach(k => g.attacks[k] = 0); g.renderAttacks(); g.gameOver(); }
  if (cmd === 'late')     { g.wave = +(q.get('wave') || 91); g.nextElement = arg2El(q.get('el')); g.createEnemy(); }
  /* ferma tutte le animazioni a un istante dato: senza, in headless si scatta
     a una fase a caso e due scatti non si possono confrontare */
  const freeze = q.get('freeze');
  if (freeze !== null) {
    await pausa(300);
    f.contentDocument.getAnimations().forEach(a => { a.pause(); a.currentTime = +freeze; });
  }

  function arg2El(v) { return v || 'fire'; }
}, 600);
</script></body></html>
